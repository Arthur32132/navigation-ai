name: Improvement / Улучшение
description: Propose a focused improvement or discuss a roadmap item.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: English or Russian is welcome. Link related roadmap items and existing issues.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change, alternatives and how success could be checked.
    validations:
      required: true
